name: ci

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CSPGuardian.sln

      - name: Build
        run: dotnet build CSPGuardian.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/CSPGuardian.Tests/CSPGuardian.Tests.csproj --configuration Release --no-build --verbosity normal

  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test Go port
        working-directory: go
        run: go test ./...

      - name: Build Go port
        working-directory: go
        run: go build ./cmd/cspguard-go

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python port
        run: PYTHONPATH=python python -m unittest discover -s python/tests -v
